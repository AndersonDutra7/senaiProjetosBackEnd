<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>SAEPSaúde</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- COLUNA 1 - PERFIL -->
      <aside class="perfil">
        <div class="perfil-topo">
          <img id="perfil-logo" src="logo_saepsaude/SAEPSaude.png" alt="Logo" />
          <h2 id="perfil-nome">SAEPSaúde</h2>
        </div>

        <div class="perfil-totais">
          <div>
            <span id="total-atividades">0</span>
            <p>Qtd. Atividades</p>
          </div>
          <div>
            <span id="total-calorias">0</span>
            <p>Qtd. Calorias</p>
          </div>
        </div>

        <button id="btn-atividade" disabled>Criar Atividade</button>

        <div class="redes">
          <img src="icones/instagram.svg" alt="Instagram" />
          <img src="icones/twitter.svg" alt="Twitter" />
          <img src="icones/tiktok.svg" alt="TikTok" />
        </div>
      </aside>

      <!-- COLUNA 2 - MAIN -->
      <main class="main">
        <header class="main-header">
          <button id="btn-login">Login</button>
          <button id="btn-logout" style="display: none">Logout</button>
        </header>

        <div class="filtros">
          <button class="filtro" data-tipo="corrida">Corrida</button>
          <button class="filtro" data-tipo="caminhada">Caminhada</button>
          <button class="filtro" data-tipo="trilha">Trilha</button>
        </div>

        <div id="lista-atividades" class="lista-atividades">
          <!-- cards inseridos via JS -->
        </div>

        <div id="paginacao" class="paginacao">
          <!-- botões inseridos via JS -->
        </div>
      </main>
    </div>

    <!-- MODAL DE LOGIN (Etapa 7) -->
    <div id="modal-login" class="modal" style="display: none">
      <div class="modal-conteudo">
        <div class="modal-topo">
          <h3>Login</h3>
          <img id="fechar-modal" src="icones/x.svg" alt="Fechar" />
        </div>
        <label>Email</label>
        <input type="text" id="input-email" />
        <label>Senha</label>
        <input type="password" id="input-senha" />
        <p id="erro-login" class="erro-msg"></p>
        <div class="modal-botoes">
          <button id="btn-cancelar">Cancelar</button>
          <button id="btn-confirmar-login">Login</button>
        </div>
      </div>
    </div>

    <div id="tela-formulario" class="tela-formulario-overlay" style="display: none">
      <div class="tela-formulario">
        <h2>Crie sua atividade</h2>
    
        <label>Tipo de atividade</label>
        <select id="form-tipo">
          <option value="">Selecione...</option>
          <option value="corrida">Corrida</option>
          <option value="caminhada">Caminhada</option>
          <option value="trilha">Trilha</option>
        </select>
        <p class="erro-msg" id="erro-tipo"></p>
    
        <label>Distância (metros)</label>
        <input type="number" id="form-distancia" placeholder="Ex: 5000" />
        <p class="erro-msg" id="erro-distancia"></p>
    
        <label>Duração (minutos)</label>
        <input type="number" id="form-duracao" placeholder="Ex: 40" />
        <p class="erro-msg" id="erro-duracao"></p>
    
        <button id="btn-criar-atividade">Criar Atividade</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
